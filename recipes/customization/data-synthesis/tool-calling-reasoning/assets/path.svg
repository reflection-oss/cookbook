<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="236" viewBox="0 0 1050 236" role="img" aria-labelledby="title desc">
<title id="title">One-shot rewrites with token-efficient reasoning</title>
<desc id="desc">Six stages: public tool-calling conversations; Beam rewrites each conversation in one shot with token-efficient reasoning before every assistant turn; verify, audit and assemble; train.jsonl; fine-tune Gemma 4 with TRL; evaluate before and after. The first four are this recipe; the last two are the SFT recipe.</desc>
