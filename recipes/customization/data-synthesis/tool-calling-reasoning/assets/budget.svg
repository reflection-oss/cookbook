<text x="730.0" y="156.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#8f9a84" text-anchor="start">Full set: about 55M teacher</text><text x="730.0" y="172.2" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#8f9a84" text-anchor="start">tokens, about 3 hours at 32</text><text x="730.0" y="188.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#8f9a84" text-anchor="start">concurrent requests.</text>
