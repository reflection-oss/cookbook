<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">What a conversation costs the teacher</title>
<desc id="desc">Tokens per conversation: ToolACE about 1,500 prompt and 1,500 completion tokens; Nemotron about 6,200 prompt and 10,500 completion tokens. The full set is about 55M teacher tokens, about 3 hours at 32 concurrent requests.</desc>
