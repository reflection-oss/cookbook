<line x1="120" y1="210.0" x2="700" y2="210.0" stroke="#1e3207" opacity="0.15"/>
<text x="108.0" y="215.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e3207" text-anchor="end">0</text>
