<rect x="170.0" y="192.5" width="70.0" height="17.5" rx="4" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="205.0" y="184.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3207" text-anchor="middle">1,500</text>
<rect x="244.0" y="192.5" width="70.0" height="17.5" rx="4" fill="#8f9a84" stroke="none" stroke-width="1.5"/>
<text x="279.0" y="184.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3207" text-anchor="middle">1,500</text>
<text x="242.0" y="232.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">ToolACE</text>
<rect x="470.0" y="137.7" width="70.0" height="72.3" rx="4" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="505.0" y="129.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3207" text-anchor="middle">6,200</text>
<rect x="544.0" y="87.5" width="70.0" height="122.5" rx="4" fill="#8f9a84" stroke="none" stroke-width="1.5"/>
<text x="579.0" y="79.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3207" text-anchor="middle">10,500</text>
<text x="542.0" y="232.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">Nemotron</text>
