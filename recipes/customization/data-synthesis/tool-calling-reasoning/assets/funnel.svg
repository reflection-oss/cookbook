<text x="215.0" y="140.8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">19,502 fewer than two</text><text x="215.0" y="154.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">calls; 21,746 no state</text><text x="215.0" y="168.2" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">dependence; 219 too</text><text x="215.0" y="182.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">long; 69 transfer only</text>
<rect x="300.0" y="175.5" width="100.0" height="20.5" rx="4" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="350.0" y="167.5" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">11,292</text>
<text x="350.0" y="214.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="middle">pass look up, then</text><text x="350.0" y="229.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="middle">act</text>
<path d="M410.0 193.0L560.0 193.0" fill="none" stroke="#1e3207" stroke-width="2" marker-end="url(#arrow)"/>
<text x="485.0" y="316.8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">act, don't ask: 463 call-</text>
<text x="485.0" y="330.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">result conversations</text>
<text x="485.0" y="344.2" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">answered from memory;</text>
<text x="485.0" y="358.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">the audit dropped 11</text>
<rect x="570.0" y="190.0" width="100.0" height="6.0" rx="4" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="620.0" y="354.3" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">1,145</text>
<text x="620.0" y="390.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">kept in our run,</text>
<text x="620.0" y="405.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">from 2,922 sent</text>
