<rect x="840.0" y="190.0" width="100.0" height="6.0" rx="4" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="890.0" y="182.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">2,796</text>
<text x="890.0" y="214.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="middle">kept after the</text><text x="890.0" y="229.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="middle">audit</text>
<text x="30.0" y="244.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="start">ToolACE</text>
<rect x="30.0" y="276.0" width="100.0" height="96.0" rx="4" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="80.0" y="268.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">11,300</text>
<text x="80.0" y="390.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="middle">conversations</text>
<path d="M140.0 369.0L290.0 369.0" fill="none" stroke="#1e3207" stroke-width="2" marker-end="url(#arrow)"/>
<text x="215.0" y="303.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">1,302 without a call are</text><text x="215.0" y="316.8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">skipped; every multi-</text><text x="215.0" y="330.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">step and call-result</text><text x="215.0" y="344.2" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">conversation and 840</text><text x="215.0" y="358.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="middle">single-call ones go on</text>
<rect x="300.0" y="358.1" width="100.0" height="13.9" rx="4" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="350.0" y="350.1" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">1,635</text>
<text x="350.0" y="390.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="middle">selected</text>
