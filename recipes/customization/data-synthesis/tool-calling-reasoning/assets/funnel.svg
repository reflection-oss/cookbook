<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img" aria-labelledby="title desc">
<title id="title">Two selection rules, two funnels</title>
<desc id="desc">Nemotron: 52,828 rows in the pool, 11,292 pass the look-up-then-act rule, 3,000 are drawn and 2,796 are kept after the audit. ToolACE: 11,300 conversations, 1,635 selected, 1,145 kept after act-don't-ask and the audit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1e3207"/></marker></defs>
<rect width="1000" height="424" rx="16" fill="#f8f6f0"/>
<text x="30.0" y="36.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#1e3207" text-anchor="start">Two selection rules, two funnels</text>
<text x="30.0" y="68.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="start">Nemotron customer service</text>
<rect x="30.0" y="100.0" width="100.0" height="96.0" rx="4" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="80.0" y="92.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">52,828</text>
<text x="80.0" y="214.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="middle">rows in the pool</text>
