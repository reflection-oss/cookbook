<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">Beam rewrites the conversation; the calls come back verbatim</title>
<desc id="desc">The same ToolACE conversation before and after the teacher: the user turn, two tool calls, two results and the reply are unchanged, and a short thought appears above each assistant turn naming the function and justifying its arguments.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1e3207"/></marker></defs>
<rect width="1000" height="640" rx="16" fill="#f8f6f0"/>
<text x="30.0" y="36.0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#1e3207" text-anchor="start">Beam rewrites the conversation; the calls come back verbatim</text>
<text x="255.0" y="62.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">Original</text>
<text x="745.0" y="62.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e3207" text-anchor="middle">After the teacher</text>
<rect x="30.0" y="74.0" width="450.0" height="70.0" rx="8" fill="#ffffff" stroke="#dfe4d8" stroke-width="1.5"/>
<text x="36.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">user</text>
<text x="92.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">I'm organizing a snowboarding competition at Aspen … are</text><text x="92.0" y="106.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">snowboards and boots … available for purchase … the</text><text x="92.0" y="121.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">difficulty level of a backflip trick for male</text><text x="92.0" y="136.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">competitors?</text>
<rect x="520.0" y="74.0" width="450.0" height="70.0" rx="8" fill="#ffffff" stroke="#dfe4d8" stroke-width="1.5"/>
<text x="526.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">user</text>
<text x="582.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">I'm organizing a snowboarding competition at Aspen … are</text><text x="582.0" y="106.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">snowboards and boots … available for purchase … the</text><text x="582.0" y="121.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">difficulty level of a backflip trick for male</text><text x="582.0" y="136.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">competitors?</text>
<rect x="520.0" y="150.0" width="450.0" height="55.0" rx="8" fill="#e3ecd7" stroke="none" stroke-width="1.5"/>
<text x="526.0" y="167.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">thought</text>
<text x="582.0" y="167.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">getSnowboardGearAvailability is the only function that</text><text x="582.0" y="182.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">checks gear availability … snow_conditions to fresh</text><text x="582.0" y="197.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">powder because it is snowing today …</text>
<rect x="30.0" y="211.0" width="450.0" height="75.0" rx="8" fill="#dfe4d8" stroke="none" stroke-width="1.5"/>
<text x="36.0" y="228.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">assistant</text>
<text x="92.0" y="228.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">getSnowboardGearAvailability(location=&quot;Aspen&quot;,</text><text x="92.0" y="243.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">season=&quot;winter&quot;, snow_conditions=&quot;fresh powder&quot;,</text><text x="92.0" y="258.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">gear_type=&quot;snowboards, boots&quot;)</text>
<rect x="520.0" y="211.0" width="450.0" height="75.0" rx="8" fill="#dfe4d8" stroke="none" stroke-width="1.5"/>
<text x="526.0" y="228.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">assistant</text>
<text x="582.0" y="228.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">getSnowboardGearAvailability(location=&quot;Aspen&quot;,</text><text x="582.0" y="243.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">season=&quot;winter&quot;, snow_conditions=&quot;fresh powder&quot;,</text><text x="582.0" y="258.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">gear_type=&quot;snowboards, boots&quot;)</text>
<rect x="896.0" y="264.0" width="66.0" height="18.0" rx="9" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="929.0" y="277.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">verbatim</text>
<rect x="30.0" y="292.0" width="450.0" height="25.0" rx="8" fill="#ffffff" stroke="#dfe4d8" stroke-width="1.5"/>
<text x="36.0" y="309.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">tool</text>
<text x="92.0" y="309.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">{&quot;availability&quot;: true}</text>
<rect x="520.0" y="292.0" width="450.0" height="25.0" rx="8" fill="#ffffff" stroke="#dfe4d8" stroke-width="1.5"/>
<text x="526.0" y="309.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">tool</text>
<text x="582.0" y="309.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">{&quot;availability&quot;: true}</text>
<rect x="520.0" y="323.0" width="450.0" height="70.0" rx="8" fill="#e3ecd7" stroke="none" stroke-width="1.5"/>
<text x="526.0" y="340.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">thought</text>
<text x="582.0" y="340.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">The gear availability result is true … the difficulty</text><text x="582.0" y="355.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">level of a backflip … requires</text><text x="582.0" y="370.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">getSnowboardTrickDifficulty; I set trick_name to</text><text x="582.0" y="385.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">backflip and gender to male.</text>
<rect x="30.0" y="399.0" width="450.0" height="60.0" rx="8" fill="#dfe4d8" stroke="none" stroke-width="1.5"/>
<text x="36.0" y="416.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">assistant</text>
<text x="92.0" y="416.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">getSnowboardTrickDifficulty(trick_name=&quot;backflip&quot;,</text><text x="92.0" y="431.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">gender=&quot;male&quot;)</text>
<rect x="520.0" y="399.0" width="450.0" height="60.0" rx="8" fill="#dfe4d8" stroke="none" stroke-width="1.5"/>
<text x="526.0" y="416.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">assistant</text>
<text x="582.0" y="416.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">getSnowboardTrickDifficulty(trick_name=&quot;backflip&quot;,</text><text x="582.0" y="431.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">gender=&quot;male&quot;)</text>
<rect x="896.0" y="437.0" width="66.0" height="18.0" rx="9" fill="#1e3207" stroke="none" stroke-width="1.5"/>
<text x="929.0" y="450.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">verbatim</text>
<rect x="30.0" y="465.0" width="450.0" height="25.0" rx="8" fill="#ffffff" stroke="#dfe4d8" stroke-width="1.5"/>
<text x="36.0" y="482.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">tool</text>
<text x="92.0" y="482.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">{&quot;difficulty_level&quot;: &quot;advanced&quot;}</text>
<rect x="520.0" y="465.0" width="450.0" height="25.0" rx="8" fill="#ffffff" stroke="#dfe4d8" stroke-width="1.5"/>
<text x="526.0" y="482.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">tool</text>
<text x="582.0" y="482.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">{&quot;difficulty_level&quot;: &quot;advanced&quot;}</text>
<rect x="520.0" y="496.0" width="450.0" height="55.0" rx="8" fill="#e3ecd7" stroke="none" stroke-width="1.5"/>
<text x="526.0" y="513.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">thought</text>
<text x="582.0" y="513.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">The trick difficulty result is advanced, which answers</text><text x="582.0" y="528.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">the user's follow-up question. No further tool calls are</text><text x="582.0" y="543.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start" font-style="italic">needed, so I will report that result.</text>
<rect x="30.0" y="557.0" width="450.0" height="40.0" rx="8" fill="#ffffff" stroke="#dfe4d8" stroke-width="1.5"/>
<text x="36.0" y="574.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">assistant</text>
<text x="92.0" y="574.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">The difficulty level for a backflip trick for male</text><text x="92.0" y="589.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">competitors is categorized as advanced.</text>
<rect x="520.0" y="557.0" width="450.0" height="40.0" rx="8" fill="#ffffff" stroke="#dfe4d8" stroke-width="1.5"/>
<text x="526.0" y="574.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8f9a84" text-anchor="start">assistant</text>
<text x="582.0" y="574.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">The difficulty level for a backflip trick for male</text><text x="582.0" y="589.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e3207" text-anchor="start">competitors is categorized as advanced.</text>
