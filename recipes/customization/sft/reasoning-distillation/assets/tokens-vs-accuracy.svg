<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy against output tokens for three thought styles on the 12B</title>
  <desc id="desc">Purpose-style thoughts match verbose thoughts within a point at 25 percent fewer tokens; concise thoughts save more tokens and lose five points; the stock model spends the most tokens.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1e3207"/></marker></defs>
  <rect width="1000" height="340" rx="16" fill="#f8f6f0"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="500.0" y="36.0" font-size="22" fill="#1e3207" text-anchor="middle" font-weight="600">Why the recipe uses purpose-style thoughts (12B)</text>
    <line x1="90.0" y1="280.0" x2="930.0" y2="280.0" stroke="#1e3207" stroke-width="1" opacity="0.15"/>
    <text x="80.0" y="285.0" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">40</text>
    <line x1="90.0" y1="245.0" x2="930.0" y2="245.0" stroke="#1e3207" stroke-width="1" opacity="0.15"/>
    <text x="80.0" y="250.0" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">42</text>
    <line x1="90.0" y1="210.0" x2="930.0" y2="210.0" stroke="#1e3207" stroke-width="1" opacity="0.15"/>
    <text x="80.0" y="215.0" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">44</text>
    <line x1="90.0" y1="175.0" x2="930.0" y2="175.0" stroke="#1e3207" stroke-width="1" opacity="0.15"/>
    <text x="80.0" y="180.0" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">46</text>
    <line x1="90.0" y1="140.0" x2="930.0" y2="140.0" stroke="#1e3207" stroke-width="1" opacity="0.15"/>
    <text x="80.0" y="145.0" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">48</text>
    <line x1="90.0" y1="105.0" x2="930.0" y2="105.0" stroke="#1e3207" stroke-width="1" opacity="0.15"/>
    <text x="80.0" y="110.0" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">50</text>
    <line x1="90.0" y1="70.0" x2="930.0" y2="70.0" stroke="#1e3207" stroke-width="1" opacity="0.15"/>
    <text x="80.0" y="75.0" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">52</text>
    <text x="90.0" y="302.0" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="normal">1M</text>
    <text x="210.0" y="302.0" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="normal">2M</text>
    <text x="330.0" y="302.0" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="normal">3M</text>
    <text x="450.0" y="302.0" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="normal">4M</text>
    <text x="570.0" y="302.0" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="normal">5M</text>
    <text x="690.0" y="302.0" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="normal">6M</text>
    <text x="810.0" y="302.0" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="normal">7M</text>
    <text x="930.0" y="302.0" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="normal">8M</text>
    <text x="510.0" y="326.0" font-size="14" fill="#1e3207" text-anchor="middle" font-weight="normal">output tokens over the benchmark</text>
    <text transform="translate(30 175) rotate(-90)" text-anchor="middle" font-size="14" fill="#1e3207">BFCL v4 overall</text>
    <circle cx="814.8" cy="105.4" r="8" fill="#8f9a84" stroke="#f8f6f0" stroke-width="2"/>
    <text x="798.8" y="97.4" font-size="14" fill="#1e3207" text-anchor="end" font-weight="600">stock, no fine-tune</text>
    <text x="798.8" y="115.4" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">49.98 at 7.04M tokens</text>
    <circle cx="475.2" cy="145.2" r="8" fill="#1e3207" stroke="#f8f6f0" stroke-width="2"/>
    <text x="491.2" y="131.2" font-size="14" fill="#1e3207" text-anchor="start" font-weight="600">verbose thoughts</text>
    <text x="491.2" y="149.2" font-size="13" fill="#1e3207" text-anchor="start" font-weight="normal">47.70 at 4.21M tokens</text>
    <circle cx="349.2" cy="155.2" r="8" fill="#1e3207" stroke="#f8f6f0" stroke-width="2"/>
    <text x="333.2" y="175.2" font-size="14" fill="#1e3207" text-anchor="end" font-weight="600">purpose thoughts (the recipe)</text>
    <text x="333.2" y="193.2" font-size="13" fill="#1e3207" text-anchor="end" font-weight="normal">47.13 at 3.16M tokens</text>
    <circle cx="248.4" cy="238.3" r="8" fill="#1e3207" stroke="#f8f6f0" stroke-width="2"/>
    <text x="264.4" y="230.3" font-size="14" fill="#1e3207" text-anchor="start" font-weight="600">concise thoughts</text>
    <text x="264.4" y="248.3" font-size="13" fill="#1e3207" text-anchor="start" font-weight="normal">42.38 at 2.32M tokens</text>
  </g>
</svg>
