<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">From public conversations to an evaluated fine-tune</title>
  <desc id="desc">Public tool-calling conversations are rewritten by Beam in one shot with token-efficient reasoning before every assistant turn, verified and assembled into train.jsonl, and this recipe fine-tunes Gemma 4 on that file and evaluates it.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1e3207"/></marker></defs>
  <rect width="1000" height="230" rx="16" fill="#f8f6f0"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="22.0" y="48.0" width="140.0" height="104.0" rx="12" fill="#dfe4d8"/>
    <text x="92.0" y="75.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">Public</text>
    <text x="92.0" y="95.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">tool-calling</text>
    <text x="92.0" y="115.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">conversations</text>
    <text x="92.0" y="135.0" font-size="12" fill="#1e3207" text-anchor="middle" font-weight="normal">ToolACE, Nemotron</text>
    <line x1="165.0" y1="100.0" x2="184.0" y2="100.0" stroke="#1e3207" stroke-width="2" opacity="1" marker-end="url(#arrow)"/>
    <rect x="188.0" y="48.0" width="140.0" height="104.0" rx="12" fill="#dfe4d8"/>
    <text x="258.0" y="70.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">Beam rewrites</text>
<text x="258.0" y="88.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">the conversation</text>
<text x="258.0" y="106.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">in one shot with</text>
<text x="258.0" y="124.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">token-efficient</text>
<text x="258.0" y="142.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">reasoning</text>
                <line x1="331.0" y1="100.0" x2="350.0" y2="100.0" stroke="#1e3207" stroke-width="2" opacity="1" marker-end="url(#arrow)"/>
    <rect x="354.0" y="48.0" width="140.0" height="104.0" rx="12" fill="#dfe4d8"/>
    <text x="424.0" y="95.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">Verify, audit,</text>
    <text x="424.0" y="115.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">assemble</text>
    <line x1="497.0" y1="100.0" x2="516.0" y2="100.0" stroke="#1e3207" stroke-width="2" opacity="1" marker-end="url(#arrow)"/>
    <rect x="520.0" y="48.0" width="140.0" height="104.0" rx="12" fill="#dfe4d8"/>
    <text x="590.0" y="105.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">train.jsonl</text>
    <line x1="663.0" y1="100.0" x2="682.0" y2="100.0" stroke="#1e3207" stroke-width="2" opacity="1" marker-end="url(#arrow)"/>
    <rect x="686.0" y="48.0" width="140.0" height="104.0" rx="12" fill="#1e3207"/>
    <text x="756.0" y="85.0" font-size="15" fill="white" text-anchor="middle" font-weight="600">Fine-tune</text>
    <text x="756.0" y="105.0" font-size="15" fill="white" text-anchor="middle" font-weight="600">Gemma 4 with</text>
    <text x="756.0" y="125.0" font-size="15" fill="white" text-anchor="middle" font-weight="600">TRL</text>
    <line x1="829.0" y1="100.0" x2="848.0" y2="100.0" stroke="#1e3207" stroke-width="2" opacity="1" marker-end="url(#arrow)"/>
    <rect x="852.0" y="48.0" width="140.0" height="104.0" rx="12" fill="#1e3207"/>
    <text x="922.0" y="85.0" font-size="15" fill="white" text-anchor="middle" font-weight="600">Evaluate</text>
    <text x="922.0" y="105.0" font-size="15" fill="white" text-anchor="middle" font-weight="600">before and</text>
    <text x="922.0" y="125.0" font-size="15" fill="white" text-anchor="middle" font-weight="600">after</text>
    <line x1="22.0" y1="174.0" x2="660.0" y2="174.0" stroke="#1e3207" stroke-width="1.5" opacity="1"/>
    <text x="341.0" y="196.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">Data recipe</text>
    <text x="341.0" y="216.0" font-size="14" fill="#1e3207" text-anchor="middle" font-weight="normal">data-synthesis/tool-calling-reasoning</text>
    <line x1="686.0" y1="174.0" x2="992.0" y2="174.0" stroke="#1e3207" stroke-width="1.5" opacity="1"/>
    <text x="839.0" y="196.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">This recipe</text>
    <text x="839.0" y="216.0" font-size="14" fill="#1e3207" text-anchor="middle" font-weight="normal">sft/reasoning-distillation</text>
  </g>
</svg>
