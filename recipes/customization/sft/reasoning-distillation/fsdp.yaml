# accelerate config: FSDP (version 1), full shard, bf16, 8 GPUs, one machine.
# train.sh fills in the decoder-layer class for the model being trained:
# Gemma4UnifiedTextDecoderLayer for the dense 12B, Gemma4TextDecoderLayer
# for E2B and E4B.
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
num_machines: 1
num_processes: 8
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
use_cpu: false
fsdp_config:
  fsdp_version: 1
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: __DECODER_LAYER_CLASS__
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_offload_params: false
  fsdp_use_orig_params: true
  fsdp_sync_module_states: true
  fsdp_cpu_ram_efficient_loading: false
  fsdp_forward_prefetch: false
