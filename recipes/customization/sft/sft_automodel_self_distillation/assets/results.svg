<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Held-out results: fewer broken kernels, same reasoning length</title>
  <desc id="desc">Pass at 1 on the 200 held-out tasks rises from 43.9 to 52.6 percent. Over the 800 samples per model, torch fallbacks drop from 183 to 132 and runtime errors from 203 to 174, while numerical failures stay rare at 34 against 45; the median completion length is unchanged.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1e3207"/></marker></defs>
  <rect width="960" height="420" rx="16" fill="#f8f6f0"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="240.0" y="40.0" font-size="18" fill="#1e3207" text-anchor="middle" font-weight="600">Held-out pass@1</text>
    <text x="240.0" y="60.0" font-size="13" fill="#8f9a84" text-anchor="middle" font-weight="normal">200 tasks, four attempts each</text>
    <path d="M120.0 300.0V154.7Q120.0 150.7 124.0 150.7H206.0Q210.0 150.7 210.0 154.7V300.0Z" fill="#dfe4d8"/>
    <text x="165.0" y="140.7" font-size="16" fill="#1e3207" text-anchor="middle" font-weight="600">43.9 %</text>
    <text x="165.0" y="322.0" font-size="14" fill="#1e3207" text-anchor="middle" font-weight="normal">base</text>
    <path d="M250.0 300.0V125.2Q250.0 121.2 254.0 121.2H336.0Q340.0 121.2 340.0 125.2V300.0Z" fill="#1e3207"/>
    <text x="295.0" y="111.2" font-size="16" fill="#1e3207" text-anchor="middle" font-weight="600">52.6 %</text>
    <text x="295.0" y="322.0" font-size="14" fill="#1e3207" text-anchor="middle" font-weight="normal">fine-tuned</text>
    <text x="240.0" y="352.0" font-size="15" fill="#1e3207" text-anchor="middle" font-weight="600">+8.7 points</text>
    <text x="680.0" y="40.0" font-size="18" fill="#1e3207" text-anchor="middle" font-weight="600">Why the samples fail</text>
    <text x="680.0" y="60.0" font-size="13" fill="#8f9a84" text-anchor="middle" font-weight="normal">failures per 800 samples</text>
    <path d="M500.0 300.0V190.5Q500.0 186.5 504.0 186.5H536.0Q540.0 186.5 540.0 190.5V300.0Z" fill="#dfe4d8"/>
    <text x="520.0" y="178.5" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="600">183</text>
    <path d="M546.0 300.0V222.2Q546.0 218.2 550.0 218.2H582.0Q586.0 218.2 586.0 222.2V300.0Z" fill="#1e3207"/>
    <text x="566.0" y="210.2" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="600">132</text>
    <text x="543.0" y="322.0" font-size="13.5" fill="#1e3207" text-anchor="middle" font-weight="normal">torch fallback</text>
    <path d="M630.0 300.0V178.1Q630.0 174.1 634.0 174.1H666.0Q670.0 174.1 670.0 178.1V300.0Z" fill="#dfe4d8"/>
    <text x="650.0" y="166.1" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="600">203</text>
    <path d="M676.0 300.0V196.1Q676.0 192.1 680.0 192.1H712.0Q716.0 192.1 716.0 196.1V300.0Z" fill="#1e3207"/>
    <text x="696.0" y="184.1" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="600">174</text>
    <text x="673.0" y="322.0" font-size="13.5" fill="#1e3207" text-anchor="middle" font-weight="normal">runtime error</text>
    <path d="M760.0 300.0V282.9Q760.0 278.9 764.0 278.9H796.0Q800.0 278.9 800.0 282.9V300.0Z" fill="#dfe4d8"/>
    <text x="780.0" y="270.9" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="600">34</text>
    <path d="M806.0 300.0V276.1Q806.0 272.1 810.0 272.1H842.0Q846.0 272.1 846.0 276.1V300.0Z" fill="#1e3207"/>
    <text x="826.0" y="264.1" font-size="13" fill="#1e3207" text-anchor="middle" font-weight="600">45</text>
    <text x="803.0" y="322.0" font-size="13.5" fill="#1e3207" text-anchor="middle" font-weight="normal">numerical</text>
    <rect x="500.0" y="336.0" width="14.0" height="14.0" rx="4" fill="#dfe4d8"/>
    <text x="520.0" y="348.0" font-size="13" fill="#1e3207" text-anchor="start" font-weight="normal">base</text>
    <rect x="570.0" y="336.0" width="14.0" height="14.0" rx="4" fill="#1e3207"/>
    <text x="590.0" y="348.0" font-size="13" fill="#1e3207" text-anchor="start" font-weight="normal">fine-tuned</text>
    <text x="680.0" y="376.0" font-size="13" fill="#8f9a84" text-anchor="middle" font-weight="normal">median completion 14.6k tokens before, 14.2k after:</text>
    <text x="680.0" y="394.0" font-size="13" fill="#8f9a84" text-anchor="middle" font-weight="normal">the gain is not bought with longer reasoning</text>
  </g>
</svg>
