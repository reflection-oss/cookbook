<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Nearly flat losses, a 8.7-point capability gain</title>
  <desc id="desc">Over the 114-step run the training loss moves from 0.63 to 0.58 and the validation loss stays essentially flat at 0.646 to 0.656, while the verifier-measured held-out pass at 1 rises from 43.9 to 52.6 percent. Losses and pass rate are drawn on their own scales.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1e3207"/></marker></defs>
  <rect width="960" height="320" rx="16" fill="#f8f6f0"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="480.0" y="40.0" font-size="21" fill="#1e3207" text-anchor="middle" font-weight="600">The verifier, not the loss, is the signal</text>
    <text x="246.0" y="101.0" font-size="15" fill="#1e3207" text-anchor="end" font-weight="normal">training loss</text>
    <line x1="280.0" y1="96.0" x2="700.0" y2="96.0" stroke="#d6d8d0" stroke-width="1" opacity="1"/>
    <line x1="544.6" y1="96.0" x2="523.6" y2="96.0" stroke="#1e3207" stroke-width="2.5" opacity="1"/>
    <circle cx="544.6" cy="96.0" r="6" fill="#dfe4d8" stroke="#1e3207" stroke-width="1.5"/>
    <circle cx="523.6" cy="96.0" r="6" fill="#1e3207"/>
    <text x="730.0" y="101.0" font-size="14.5" fill="#1e3207" text-anchor="start" font-weight="600">0.63 to 0.58</text>
    <text x="246.0" y="153.0" font-size="15" fill="#1e3207" text-anchor="end" font-weight="normal">validation loss</text>
    <line x1="280.0" y1="148.0" x2="700.0" y2="148.0" stroke="#d6d8d0" stroke-width="1" opacity="1"/>
    <line x1="551.3" y1="148.0" x2="555.5" y2="148.0" stroke="#1e3207" stroke-width="2.5" opacity="1"/>
    <circle cx="551.3" cy="148.0" r="6" fill="#dfe4d8" stroke="#1e3207" stroke-width="1.5"/>
    <circle cx="555.5" cy="148.0" r="6" fill="#1e3207"/>
    <text x="730.0" y="153.0" font-size="14.5" fill="#1e3207" text-anchor="start" font-weight="600">0.646 to 0.656, flat</text>
    <text x="246.0" y="205.0" font-size="15" fill="#1e3207" text-anchor="end" font-weight="normal">held-out pass@1</text>
    <line x1="280.0" y1="200.0" x2="700.0" y2="200.0" stroke="#d6d8d0" stroke-width="1" opacity="1"/>
    <line x1="464.4" y1="200.0" x2="500.9" y2="200.0" stroke="#1e3207" stroke-width="2.5" opacity="1"/>
    <circle cx="464.4" cy="200.0" r="6" fill="#dfe4d8" stroke="#1e3207" stroke-width="1.5"/>
    <circle cx="500.9" cy="200.0" r="6" fill="#1e3207"/>
    <text x="730.0" y="205.0" font-size="14.5" fill="#1e3207" text-anchor="start" font-weight="600">43.9 % to 52.6 %</text>
    <circle cx="286" cy="260.0" r="6" fill="#dfe4d8" stroke="#1e3207" stroke-width="1.5"/>
    <text x="300.0" y="265.0" font-size="13" fill="#1e3207" text-anchor="start" font-weight="normal">start of the run</text>
    <circle cx="436" cy="260.0" r="6" fill="#1e3207"/>
    <text x="450.0" y="265.0" font-size="13" fill="#1e3207" text-anchor="start" font-weight="normal">end of the run</text>
    <text x="480.0" y="298.0" font-size="13.5" fill="#8f9a84" text-anchor="middle" font-weight="normal">Training on the model’s own output leaves the losses nearly flat; the verifier measures the gain anyway.</text>
  </g>
</svg>
