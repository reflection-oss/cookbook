<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">From 2,065 sampled tasks to 744 training rows</title>
  <desc id="desc">Of 2,065 tasks, 1,853 are solved within sixteen attempts: 1,067 on the first attempt and 786 after two to sixteen. All 786 hard tasks plus 214 easy ones form the 1,000-task set, split 800 training and 200 validation; 56 rows over 32,768 tokens are excluded, leaving 744.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1e3207"/></marker></defs>
  <rect width="960" height="420" rx="16" fill="#f8f6f0"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="480.0" y="40.0" font-size="21" fill="#1e3207" text-anchor="middle" font-weight="600">From sampled tasks to training rows</text>
    <path d="M72.0 68.0H894.0Q898.0 68.0 898.0 72.0V94.0Q898.0 98.0 894.0 98.0H72.0Z" fill="#dfe4d8"/>
    <text x="84.0" y="89.0" font-size="15" fill="#1e3207" text-anchor="start" font-weight="600">2,065</text>
    <text x="148.0" y="89.0" font-size="14.5" fill="#1e3207" text-anchor="start" font-weight="normal">tasks sampled, up to sixteen attempts each</text>
    <path d="M72.0 124.0H809.2Q813.2 124.0 813.2 128.0V150.0Q813.2 154.0 809.2 154.0H72.0Z" fill="#dfe4d8"/>
    <text x="84.0" y="145.0" font-size="15" fill="#1e3207" text-anchor="start" font-weight="600">1,853</text>
    <text x="148.0" y="145.0" font-size="14.5" fill="#1e3207" text-anchor="start" font-weight="normal">solved within sixteen attempts</text>
    <text x="827.2" y="145.0" font-size="12.5" fill="#8f9a84" text-anchor="start" font-weight="normal">212 never pass</text>
    <line x1="498.8" y1="158.0" x2="498.8" y2="168.0" stroke="#8f9a84" stroke-width="1.5" opacity="1"/>
    <text x="285.4" y="180.0" font-size="12.5" fill="#8f9a84" text-anchor="middle" font-weight="normal">1,067 easy: solved on the first attempt</text>
    <text x="656.0" y="180.0" font-size="12.5" fill="#8f9a84" text-anchor="middle" font-weight="normal">786 hard: needed two to sixteen</text>
    <path d="M72.0 214.0H468.0Q472.0 214.0 472.0 218.0V240.0Q472.0 244.0 468.0 244.0H72.0Z" fill="#dfe4d8"/>
    <text x="84.0" y="235.0" font-size="15" fill="#1e3207" text-anchor="start" font-weight="600">1,000</text>
    <text x="486.0" y="235.0" font-size="14.5" fill="#1e3207" text-anchor="start" font-weight="normal">selected: all 786 hard tasks, 214 easy ones</text>
    <text x="486.0" y="253.0" font-size="12.5" fill="#8f9a84" text-anchor="start" font-weight="normal">853 easy set aside</text>
    <path d="M72.0 270.0H388.0Q392.0 270.0 392.0 274.0V296.0Q392.0 300.0 388.0 300.0H72.0Z" fill="#dfe4d8"/>
    <text x="84.0" y="291.0" font-size="15" fill="#1e3207" text-anchor="start" font-weight="600">800</text>
    <text x="406.0" y="291.0" font-size="14.5" fill="#1e3207" text-anchor="start" font-weight="normal">training tasks (200 held out for validation)</text>
    <path d="M72.0 326.0H365.6Q369.6 326.0 369.6 330.0V352.0Q369.6 356.0 365.6 356.0H72.0Z" fill="#1e3207"/>
    <text x="84.0" y="347.0" font-size="15" fill="white" text-anchor="start" font-weight="600">744</text>
    <text x="383.6" y="347.0" font-size="14.5" fill="#1e3207" text-anchor="start" font-weight="normal">training rows</text>
    <text x="383.6" y="365.0" font-size="12.5" fill="#8f9a84" text-anchor="start" font-weight="normal">56 rows over 32,768 tokens</text>
  </g>
</svg>
