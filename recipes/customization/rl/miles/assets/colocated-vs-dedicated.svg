<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 60 1000 660" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1e3207"/></marker></defs><rect width="1000" height="720" rx="16" fill="#f8f6f0"/><g font-family="Inter, Arial, sans-serif"><text x="40" y="100" font-size="23" fill="#1e3207" font-weight="600">Colocated</text><text x="40" y="130" font-size="18" fill="#1a1b1a" font-weight="400">One GPU pool alternates between generation and training.</text><rect x="225" y="160" width="130" height="56" rx="9" fill="#dfe4d8"/><text x="239" y="194.0" font-size="17" fill="#1e3207" font-weight="400">Generate 1</text><rect x="375" y="160" width="200" height="56" rx="9" fill="#1e3207"/><text x="389" y="194.0" font-size="17" fill="white" font-weight="400">Train 1</text><rect x="595" y="160" width="130" height="56" rx="9" fill="#dfe4d8"/><text x="609" y="194.0" font-size="17" fill="#1e3207" font-weight="400">Generate 2</text><rect x="745" y="160" width="200" height="56" rx="9" fill="#1e3207"/><text x="759" y="194.0" font-size="17" fill="white" font-weight="400">Train 2</text><text x="40" y="195" font-size="18" fill="#1a1b1a" font-weight="400">Shared GPUs</text><path d="M225 242 L925 242" fill="none" stroke="#1e3207" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="267" font-size="15" fill="#1a1b1a" font-weight="400">Time</text><text x="40" y="305" font-size="17" fill="#1a1b1a" font-weight="400">Tradeoff: each stage waits for the other.</text><path d="M40 335H960" stroke="#d3d6cc"/><text x="40" y="380" font-size="23" fill="#1e3207" font-weight="600">Dedicated + async</text><text x="40" y="410" font-size="18" fill="#1a1b1a" font-weight="400">Separate GPU pools overlap generation and training.</text><text x="40" y="465" font-size="17" fill="#1a1b1a" font-weight="400">Generation GPUs</text><text x="40" y="545" font-size="17" fill="#1a1b1a" font-weight="400">Training GPUs</text><rect x="225" y="432" width="130" height="56" rx="9" fill="#dfe4d8"/><text x="239" y="466.0" font-size="17" fill="#1e3207" font-weight="400">Generate 1</text><rect x="375" y="432" width="130" height="56" rx="9" fill="#dfe4d8"/><text x="389" y="466.0" font-size="17" fill="#1e3207" font-weight="400">Generate 2</text><rect x="595" y="432" width="130" height="56" rx="9" fill="#dfe4d8"/><text x="609" y="466.0" font-size="17" fill="#1e3207" font-weight="400">Generate 3</text><rect x="375" y="512" width="200" height="56" rx="9" fill="#1e3207"/><text x="389" y="546.0" font-size="17" fill="white" font-weight="400">Train 1</text><rect x="595" y="512" width="200" height="56" rx="9" fill="#1e3207"/><text x="609" y="546.0" font-size="17" fill="white" font-weight="400">Train 2</text><path d="M225 594 L925 594" fill="none" stroke="#1e3207" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="619" font-size="15" fill="#1a1b1a" font-weight="400">Time</text><text x="40" y="658" font-size="17" fill="#1a1b1a" font-weight="400">Updated weights are synchronized back to generation workers.</text><text x="40" y="689" font-size="17" fill="#1a1b1a" font-weight="400">Tradeoff: separate GPU allocations; generated batches may use older weights.</text></g></svg>